<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: #fff0f5;
            font-family: sans-serif;
            margin: 0;
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            /* Важно: задаем высоту контейнеру, чтобы кнопка не улетала в пустоту */
            height: 60px;
            align-items: center;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yesBtn { background-color: #4ade80; color: white; }
        
        /* Кнопка "Нет" теперь имеет относительное положение изначально */
        #noBtn { 
            background-color: #f87171; 
            color: white; 
            position: relative; 
        }
    </style>
</head>
<body>

    <h1>Ты пойдешь со мной на свидание?</h1>
    <div class="buttons">
        <button id="yesBtn" onclick="alert('Ура!')">Да</button>
        <button id="noBtn" onmouseover="moveButton()">Нет</button>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('noBtn');
            
            // Меняем позиционирование на абсолютное только при первом наведении
            btn.style.position = 'absolute';
            
            // Вычисляем случайные границы экрана
            const padding = 50; // чтобы кнопка не уходила за края
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - padding);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - padding);
            
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>
</html>
