<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приглашение на свидание</title>
    <style>
        body { 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #fff0f5; 
            font-family: 'Arial', sans-serif; 
            margin: 0;
        }
        .hidden { display: none; }
        .box { text-align: center; }
        
        /* Стили кнопок */
        .btn { 
            padding: 20px 50px; /* Делаем кнопку крупнее */
            font-size: 24px;    /* Увеличиваем текст */
            border: none; 
            border-radius: 50px; /* Сильное скругление */
            cursor: pointer; 
            transition: all 0.3s ease; 
            margin: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .btn:hover { transform: scale(1.1); }
        
        #yesBtn { background-color: #4ade80; color: white; }
        #noBtn { background-color: #f87171; color: white; position: relative; }
        .option-btn { background-color: #60a5fa; color: white; min-width: 200px; }
    </style>
</head>
<body>

    <div id="main-container" class="box">
        <h1>Ты пойдешь со мной на свидание?</h1>
        <div style="display: flex; justify-content: center; align-items: center;">
            <button id="yesBtn" class="btn" onclick="showMenu()">Да!</button>
            <button id="noBtn" class="btn" onmouseover="moveButton()">Нет</button>
        </div>
    </div>

    <div id="menu-container" class="box hidden">
        <h1>Отлично! Куда пойдем?</h1>
        <button class="btn option-btn" onclick="selectPlace('Парк')">Парк 🌳</button>
        <button class="btn option-btn" onclick="selectPlace('Ресторан')">Ресторан 🍽️</button>
    </div>

    <script>
        function moveButton() {
            const btn = document.getElementById('noBtn');
            btn.style.position = 'absolute';
            // Добавим отступы, чтобы кнопка не улетала совсем за края
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 80);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function showMenu() {
            document.getElementById('main-container').classList.add('hidden');
            document.getElementById('menu-container').classList.remove('hidden');
        }

        function selectPlace(place) {
            alert('Супер! Мы идем в: ' + place);
        }
    </script>
</body>
</html>
